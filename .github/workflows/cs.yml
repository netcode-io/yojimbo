# C# port: build, unit tests, fuzz corpus regression, NuGet pack, and interop against the upstream C++ build
# and the TypeScript and Rust ports (rust.yml runs the same interop job for Rust changes).
#
# The tests bind fixed UDP ports (40000, 30000, ...), so each job runs its suites one after another.
# Jobs run on separate runners, so they can't collide with each other.

name: cs

on:
  push:
    branches: [ master ]
    paths: [ 'cs/**', 'ts/**', 'interop/**', 'cpp', '.gitmodules', '.github/workflows/cs.yml' ]
  pull_request:
    paths: [ 'cs/**', 'ts/**', 'interop/**', 'cpp', '.gitmodules', '.github/workflows/cs.yml' ]
  workflow_dispatch:

concurrency:
  group: cs-${{ github.ref }}
  cancel-in-progress: true

jobs:

  test:
    name: test (${{ matrix.os }}, ${{ matrix.configuration }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]
        configuration: [ Debug, Release ]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true          # the fuzz corpus lives in cpp/fuzz/corpus
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: build
        run: dotnet build cs/yojimbo.slnx -c ${{ matrix.configuration }}
      - name: test
        run: dotnet cs/bin/test/${{ matrix.configuration }}/test.dll
      - name: custom_packet_io_test
        run: dotnet cs/bin/custom_packet_io_test/${{ matrix.configuration }}/custom_packet_io_test.dll
      - name: fuzz corpus regression
        run: dotnet cs/bin/fuzz/${{ matrix.configuration }}/fuzz.dll
      # the library also targets netstandard2.1 (Unity): run the same tests against that build, in its own output folder
      - name: test (netstandard2.1 library)
        shell: bash
        run: |
          root="${{ runner.temp }}/ns21/"
          dotnet build cs/test.csproj -c ${{ matrix.configuration }} -p:YojimboTargetFramework=netstandard2.1 -p:BuildRoot="$root"
          dotnet build cs/custom_packet_io_test.csproj -c ${{ matrix.configuration }} -p:YojimboTargetFramework=netstandard2.1 -p:BuildRoot="$root"
          dotnet "${root}bin/test/${{ matrix.configuration }}/test.dll"
          dotnet "${root}bin/custom_packet_io_test/${{ matrix.configuration }}/custom_packet_io_test.dll"
      - name: upload fuzz crash inputs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crashes-${{ matrix.os }}-${{ matrix.configuration }}
          path: crash-*
          if-no-files-found: ignore
      - name: pack
        if: matrix.configuration == 'Release'
        run: dotnet pack cs/yojimbo.csproj -c Release -o cs/bin/nupkg

  interop:
    name: interop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest ]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true          # interop builds the upstream C++ in cpp/
      - name: rust toolchain
        run: rustup update stable --no-self-update && rustup default stable
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'        # the TypeScript side runs its .ts sources directly
      - name: interop
        run: interop/run.sh
