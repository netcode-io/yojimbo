# TypeScript port: typecheck, unit tests, custom packet I/O, browser build and bundle check, the WebRTC transport
# test, and (job browser) a yojimbo server hosted in a headless Chromium page.
#
# The tests bind fixed UDP ports (40000, 30000, ...), so each job runs its suites one after another.
# Interop against C++, C# and Rust runs in cs.yml and rust.yml.

name: ts

on:
  push:
    branches: [ master ]
    paths: [ 'ts/**', '.github/workflows/ts.yml' ]
  pull_request:
    paths: [ 'ts/**', '.github/workflows/ts.yml' ]
  workflow_dispatch:

concurrency:
  group: ts-${{ github.ref }}
  cancel-in-progress: true

jobs:

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]
    defaults:
      run:
        working-directory: ts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: ts/package-lock.json
      - run: npm ci
      - name: typecheck
        run: npm run typecheck
      - name: test
        run: npm test
      - name: custom packet io test
        run: node custom_packet_io_test.ts
      - name: build
        run: npm run build
      - name: browser bundle check (no node:*, no node-datachannel)
        run: npm run test:bundle
      - name: declarations work on TypeScript 5.0 and latest
        if: runner.os == 'Linux'
        run: npm run test:declarations
      - name: webrtc test
        run: npm run test:webrtc

  browser:
    name: browser-hosted server (headless Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: ts/package-lock.json
      - run: npm ci
      - name: install Chromium (playwright-core, pinned in package.json)
        run: npx playwright-core install --with-deps --only-shell chromium
      - name: browser test
        run: npm run test:browser
