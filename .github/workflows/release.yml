# Release: publish the C# port to NuGet (yojimbo), the TypeScript port to npm (yojimbo2) and the Rust port to
# crates.io (yojimbo).
#
# Push a tag v<VERSION>, where VERSION is the root VERSION file (e.g. v1.13.500 for upstream 1.13.5, v1.13.501 for a
# port-only fix on top of it; every package publishes that same version).
# tools/version.mjs checks the tag against VERSION, cs/yojimbo.csproj, ts/package.json, rust/Cargo.toml and the
# upstream version in cpp/. Run it by hand (Actions > release > Run workflow) for a dry run that builds, tests and
# packs but publishes nothing, or tick "publish" and pick targets to publish the current VERSION to all three
# registries or to one alone (no tag, no GitHub release):  gh workflow run release.yml -f publish=true -f targets=npm
#
# Secrets: NUGET_API_KEY (nuget.org API key with push rights for "yojimbo"), NPM_TOKEN (npm automation or granular
# token with publish rights for "yojimbo2"), CARGO_REGISTRY_TOKEN (crates.io API token with the publish-update
# scope for "yojimbo"; publish-new for the first release).

name: release

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish to NuGet, npm and crates.io (unchecked = dry run)'
        type: boolean
        default: false
      targets:
        description: 'What to publish'
        type: choice
        options: [ all, npm, nuget, crates ]
        default: all

permissions:
  contents: write        # create the GitHub release
  id-token: write        # npm provenance

concurrency:
  group: release
  cancel-in-progress: false

env:
  PUBLISH: ${{ github.event_name == 'push' || inputs.publish }}
  TARGETS: ${{ github.event_name == 'push' && 'all' || inputs.targets }}
  CARGO_TERM_COLOR: always

jobs:

  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true          # the version check reads cpp/, interop builds it
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          cache: npm
          cache-dependency-path: ts/package-lock.json
      - name: rust toolchain
        run: rustup update stable --no-self-update && rustup default stable

      - name: check versions
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            node tools/version.mjs check "${{ github.ref_name }}"
          else
            node tools/version.mjs check
          fi

      # the suites bind fixed UDP ports, so they run one after another
      - name: test (C#)
        run: |
          dotnet build cs/yojimbo.slnx -c Release
          dotnet cs/bin/test/Release/test.dll
          dotnet cs/bin/custom_packet_io_test/Release/custom_packet_io_test.dll
          dotnet cs/bin/fuzz/Release/fuzz.dll
          dotnet build cs/test.csproj -c Release -p:YojimboTargetFramework=netstandard2.1 -p:BuildRoot="$RUNNER_TEMP/ns21/"
          dotnet "$RUNNER_TEMP/ns21/bin/test/Release/test.dll"
      - name: test (TypeScript)
        working-directory: ts
        run: |
          npm ci
          npm run typecheck
          npm test
          node custom_packet_io_test.ts
          npm run test:webrtc
          npm run build
          npm run test:bundle
          npm run test:declarations
      - name: test (Rust)
        run: |
          cargo build --release --manifest-path rust/Cargo.toml
          cargo run --release --manifest-path rust/Cargo.toml --bin test
          cargo run --release --manifest-path rust/Cargo.toml --bin custom_packet_io_test
          cargo run --release --manifest-path rust/Cargo.toml --bin fuzz
      - name: interop
        run: interop/run.sh

      - name: pack
        run: |
          mkdir -p artifacts
          dotnet pack cs/yojimbo.csproj -c Release -o artifacts
          (cd ts && npm pack --pack-destination ../artifacts)
          cargo package --manifest-path rust/Cargo.toml
          cp "rust/target/package/yojimbo-$(cat VERSION).crate" artifacts/
          ls -l artifacts

      - name: publish to NuGet
        if: env.PUBLISH == 'true' && (env.TARGETS == 'all' || env.TARGETS == 'nuget')
        run: dotnet nuget push "artifacts/*.nupkg" --api-key "${{ secrets.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
      - name: publish to npm
        if: env.PUBLISH == 'true' && (env.TARGETS == 'all' || env.TARGETS == 'npm')
        working-directory: ts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --provenance --access public
      - name: dry run (npm)
        if: env.PUBLISH != 'true' || (env.TARGETS != 'all' && env.TARGETS != 'npm')
        working-directory: ts
        run: npm publish --dry-run
      - name: publish to crates.io
        if: env.PUBLISH == 'true' && (env.TARGETS == 'all' || env.TARGETS == 'crates')
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --manifest-path rust/Cargo.toml
      - name: dry run (crates.io)
        if: env.PUBLISH != 'true' || (env.TARGETS != 'all' && env.TARGETS != 'crates')
        run: cargo publish --dry-run --manifest-path rust/Cargo.toml

      - name: GitHub release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" artifacts/* --title "${{ github.ref_name }}" --generate-notes

      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: artifacts/
